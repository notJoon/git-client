name: C CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc, clang]

    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang clang-format git zlib1g-dev
      - name: Check formatting
        if: matrix.cc == 'gcc'
        run: make fmt-check
      - name: Build and test
        run: make test CC=${{ matrix.cc }}
