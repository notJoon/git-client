name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential clang-format
      - name: Format check
        run: make fmt-check
      - name: Build
        run: make build
      - name: Test
        run: make test
